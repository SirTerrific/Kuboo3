apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'
apply plugin: 'kotlin-kapt'

android {
    namespace "com.sethchhim.kuboo_client"
    ext {
        APP_LABEL = "@string/app_label"
        APP_LABEL_DEBUG = "@string/app_label_debug"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    compileSdk 35
    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig true
    }
    defaultConfig {
        applicationId "io.github.sirterrific.kuboo3"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 76
        versionName "1.2.41"
        buildConfigField 'long', 'TIMESTAMP', System.currentTimeMillis() + 'L'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    // Signing comes from keystore.properties, which is never committed: it holds the keystore
    // passwords in clear text. Without that file the release build is simply left unsigned, the
    // way it was before, so a checkout of this repository still builds for anyone.
    signingConfigs {
        release {
            def propertiesFile = rootProject.file("keystore.properties")
            if (propertiesFile.exists() && propertiesFile.length() > 0) {
                def properties = new Properties()
                propertiesFile.withInputStream { properties.load(it) }
                storeFile file(properties['storeFile'])
                storePassword properties['storePassword']
                keyAlias properties['keyAlias']
                keyPassword properties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null) signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [applicationLabel: APP_LABEL]
        }

        debug {
            applicationIdSuffix ".debug"
            debuggable true
            crunchPngs false
            splits.abi.enable false
            splits.density.enable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [applicationLabel: APP_LABEL_DEBUG]
        }
    }
    lint {
        // The app signals failure by assigning null to MutableLiveData<T> and having
        // observers test for it. That is a long-standing typing flaw (the types should
        // be nullable) but it is load-bearing across the whole codebase, so it cannot
        // be fixed as part of a build upgrade. Downgrade it instead of blocking release.
        disable 'NullSafeMutableLiveData'
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES',
                         'META-INF/LICENSE',
                         'META-INF/LICENSE.txt',
                         'META-INF/license.txt',
                         'META-INF/NOTICE',
                         'META-INF/NOTICE.txt',
                         'META-INF/notice.txt',
                         'META-INF/ASL2.0']
        }
    }
}
// Dagger's processor reports "<type> could not be resolved" when kapt hands it stubs
// containing error types; this makes kapt substitute the inferred types instead.
kapt {
    correctErrorTypes = true
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    //google
    kapt "androidx.room:room-compiler:2.8.5"
    implementation "androidx.work:work-runtime:2.12.0"
    implementation "androidx.annotation:annotation:1.11.0"
    implementation "androidx.appcompat:appcompat:1.8.0"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.11.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.11.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0"
    implementation "androidx.preference:preference:1.2.1"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    // used directly by the browser screens; it used to arrive through one of the vendored aars
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"
    implementation "androidx.room:room-runtime:2.8.5"
    implementation "com.google.android.material:material:1.14.0"

    //kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlin_coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlin_coroutines_version"

    //dependency injection
    final dagger_version = "2.60.1"
    implementation "com.google.dagger:dagger-android:$dagger_version"
    implementation "com.google.dagger:dagger-android-support:$dagger_version"
    kapt "com.google.dagger:dagger-android-processor:$dagger_version"
    kapt "com.google.dagger:dagger-compiler:$dagger_version"

    //glide
    final glide_version = "4.16.0"
    kapt "com.github.bumptech.glide:compiler:$glide_version"
    implementation "com.github.bumptech.glide:glide:$glide_version"
    implementation "com.github.bumptech.glide:okhttp3-integration:$glide_version"

    //fetch
    final fetch_version = "3.4.1"
    implementation "com.github.tonyofrancis.Fetch:fetch2:$fetch_version"
    implementation "com.github.tonyofrancis.Fetch:fetch2okhttp:$fetch_version"

    // 1.13.0 only shipped armeabi-v7a and x86 native libraries, so the apk would not
    // install at all on 64-bit-only devices. 1.28.0 ships arm64-v8a and x86_64 too.
    implementation 'com.artifex.mupdf:fitz:1.28.0'
    // vendored: com.booking:rtlviewpager was only ever published to JCenter, which shut
    // down in 2021. Keeping the aar in the repo removes the need for a third-party mirror.
    // sha256 dbb045aeb74bb9be98d1c83784ef259a20f127c8367be8384667b9ba5ad1fbd3
    implementation files('libs/rtlviewpager-1.0.1.aar')
    implementation 'androidx.viewpager:viewpager:1.1.0'
    // Vendored, all of them abandoned and served only from JitPack, which builds from a github
    // repository on demand: a deleted or renamed repository, or an account that goes away, takes
    // the dependency with it. Two of these are forks on the original author's own account. The
    // aar files are byte for byte what JitPack served, so nothing about the build changes -- only
    // where the file comes from. Sha256 of each, for anyone who wants to check them against the
    // artifact JitPack still serves today:
    //
    //   ca4ede1734739bb8...  BaseRecyclerViewAdapterHelper 2.9.46   list adapters
    //   cd213417d42a5b82...  changeloglib 2.1.0                     the changelog dialog
    //   037f1e618e59022d...  MaterialBadgeTextView c5a27e8          the badge on a folder
    //   800c969a32fdf3a5...  NumberProgressBar 6110ccc              download progress
    //   99662999ea8d764d...  recyclerview-animators eaea82d         list animations
    //   59fb32bd474e0408...  SparkButton 1.0.5                      the favourite button
    //   a4f28273b80fb4f5...  Android-SpinKit 1.1.0                  loading spinners
    implementation files('libs/BaseRecyclerViewAdapterHelper-2.9.46.aar')
    implementation files('libs/changelog-2.1.0.aar')
    implementation files('libs/MaterialBadgeTextView-c5a27e8.aar')
    implementation files('libs/NumberProgressBar-6110ccc.aar')
    implementation files('libs/recyclerview-animators-eaea82d.aar')
    implementation files('libs/SparkButton-1.0.5.aar')
    implementation files('libs/Android-SpinKit-1.1.0.aar')
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation 'me.relex:circleindicator:1.2.2@aar'

    implementation project(path: ':epublibdroid-kotlin')
    implementation project(path: ':kuboo_local')
    implementation project(path: ':kuboo_remote')

}
