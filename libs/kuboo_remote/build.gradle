apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'
apply plugin: 'kotlin-kapt'

android {
    namespace "com.sethchhim.kuboo_remote"
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        buildConfig true
    }
    compileSdk 35
    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests {
            // the OPDS parsers call into android.text.Html, so they need a real
            // Android runtime rather than the stubbed android.jar
            includeAndroidResources = true
        }
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    //google
    implementation 'androidx.annotation:annotation:1.11.0'

    implementation "androidx.room:room-runtime:2.8.5"
    kapt "androidx.room:room-compiler:2.8.5"

    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.11.0"

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"

    // OkHttp 4 turned the client into a final class configured through its Builder;
    // this module still subclasses OkHttpClient and overrides cache(), cookieJar() and
    // interceptors(). Moving to 4.x means rewriting that client, not bumping a version.
    final okhttp_version = "4.12.0"
    implementation "com.squareup.okhttp3:okhttp:$okhttp_version"
    implementation "com.squareup.okhttp3:logging-interceptor:$okhttp_version"

    //fetch
    final fetch_version = "3.4.1"
    implementation "com.github.tonyofrancis.Fetch:fetch2:$fetch_version"
    implementation "com.github.tonyofrancis.Fetch:fetch2okhttp:$fetch_version"

    implementation 'com.github.franmontiel:PersistentCookieJar:v1.0.1'
    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation 'commons-codec:commons-codec:1.23.0'
    implementation 'commons-io:commons-io:2.22.0'
    implementation 'org.apache.commons:commons-text:1.15.0'
    implementation 'org.jsoup:jsoup:1.23.2'
}